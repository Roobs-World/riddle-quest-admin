<svg width="400" height="120" viewBox="0 0 400 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="120" fill="transparent"/>
  
  <!-- Q -->
  <g transform="translate(20, 25)">
    <circle cx="25" cy="25" r="20" fill="#FF6B35" stroke="#333" stroke-width="3"/>
    <circle cx="25" cy="25" r="12" fill="white"/>
    <line x1="35" y1="35" x2="42" y2="42" stroke="#333" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- wordly text -->
  <g transform="translate(80, 35)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#333">
      wordly
    </text>
  </g>
  
  <!-- Decorative puzzle pieces -->
  <g transform="translate(320, 30)">
    <rect x="0" y="0" width="15" height="15" fill="#FF6B35" rx="2"/>
    <rect x="20" y="0" width="15" height="15" fill="#FFA500" rx="2"/>
    <rect x="0" y="20" width="15" height="15" fill="#FFA500" rx="2"/>
    <rect x="20" y="20" width="15" height="15" fill="#FF6B35" rx="2"/>
  </g>
</svg> 