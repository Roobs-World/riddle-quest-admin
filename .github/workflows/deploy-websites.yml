name: Deploy websites

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-websites-production
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  game:
    name: Deploy Yahoo game website
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_GAME_PROJECT_ID }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
      - name: Pull production configuration
        run: npx --yes vercel@54.14.2 pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build production artifact
        run: npx --yes vercel@54.14.2 build --prod --token="$VERCEL_TOKEN"
      - name: Deploy production artifact
        run: npx --yes vercel@54.14.2 deploy --prebuilt --prod --token="$VERCEL_TOKEN"

  dashboard:
    name: Deploy release dashboard
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_DASHBOARD_PROJECT_ID }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: docs/reports/platform-release-readiness/package-lock.json
      - name: Pull production configuration
        run: npx --yes vercel@54.14.2 pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build production artifact
        run: npx --yes vercel@54.14.2 build --prod --token="$VERCEL_TOKEN"
      - name: Deploy production artifact
        run: npx --yes vercel@54.14.2 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
