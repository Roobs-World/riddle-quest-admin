name: Release all platforms

on:
  workflow_dispatch:
    inputs:
      confirm_runner_usage:
        description: Run all platform releases using Actions allowance, up to 760 runner minutes
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: release-all-platforms
  cancel-in-progress: false

jobs:
  verify-and-package:
    name: Verify and package every supported target
    if: github.ref == 'refs/heads/main' && inputs.confirm_runner_usage
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    environment: jest-production
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - run: corepack enable
      - run: corepack prepare pnpm@12.21.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Keep dependency evidence outside the source checkout
        run: echo "RIDDLE_QUEST_TARGET_DEPENDENCY_EVIDENCE_DIR=$RUNNER_TEMP/target-dependencies" >> "$GITHUB_ENV"
      - name: Compile shared server source for the target checks
        run: pnpm build:shared
      - name: Verify every configured target
        run: pnpm verify:all-targets
      - name: Run core provider release adapters
        # Jest is published by deploy-jest.yml and YouTube is packaged by the
        # parallel youtube job, keeping their independent release boundaries.
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release/run-platform-release.mjs facebook
          if pnpm --filter @riddle-quest/reddit-app validate:contracts; then
            node scripts/release/run-platform-release.mjs reddit
          else
            echo "Reddit release handoff skipped: capture the six sanitized production contract fixtures first."
          fi
          node scripts/release/run-platform-release.mjs netflix
          node scripts/release/run-platform-release.mjs yahoo
          node scripts/release/run-platform-release.mjs gamesnacks
      - name: Prepare one neutral source and package registered distribution handoffs
        run: node scripts/release/package-neutral-handoffs.mjs
      - name: Hand the verified packages to the finalize job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-workspace-${{ github.sha }}
          if-no-files-found: error
          retention-days: 3
          path: |
            build-*.zip
            build-*.manifest.json
            build-html5.sha256
            build-html5.zip.source.json
            builds/
            platforms/web/reddit/dist/

  youtube:
    name: Verify and package the YouTube Playable
    if: github.ref == 'refs/heads/main' && inputs.confirm_runner_usage
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - run: corepack enable
      - run: corepack prepare pnpm@12.21.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Compile shared server source for the target checks
        run: pnpm build:shared
      - name: Run the YouTube release adapter
        run: node scripts/release/run-platform-release.mjs youtube
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-youtube-${{ github.sha }}
          if-no-files-found: error
          retention-days: 3
          path: |
            build-youtube.zip
            build-youtube.manifest.json
            build-youtube.test-report.json

  finalize:
    name: Verify every release target and publish the handoffs
    if: github.ref == 'refs/heads/main' && inputs.confirm_runner_usage
    needs: [verify-and-package, youtube]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: corepack prepare pnpm@12.21.0 --activate
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: release-workspace-${{ github.sha }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: release-youtube-${{ github.sha }}
      - name: Audit every release archive and manifest
        run: node scripts/release/verify-release-target-e2e.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: riddle-quest-release-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            build-*.zip
            build-*.manifest.json
            build-youtube.test-report.json
            build-html5.sha256
            build-html5.zip.source.json
            builds/facebook
            builds/reddit
            builds/yahoo
            builds/gamesnacks

  itch:
    name: Publish itch.io when configured
    if: github.ref == 'refs/heads/main' && inputs.confirm_runner_usage
    needs: finalize
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BUTLER_API_KEY: ${{ secrets.ITCH_BUTLER_API_KEY }}
      ITCH_GAME_TARGET: ${{ vars.ITCH_GAME_TARGET }}
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: riddle-quest-release-${{ github.sha }}
      - name: Publish the verified HTML5 archive
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${BUTLER_API_KEY}" || -z "${ITCH_GAME_TARGET}" ]]; then
            echo "itch.io skipped: configure ITCH_BUTLER_API_KEY and ITCH_GAME_TARGET after creating the project page."
            exit 0
          fi
          curl --fail --location --silent --show-error \
            https://broth.itch.ovh/butler/linux-amd64/LATEST/archive/default \
            --output /tmp/butler.zip
          unzip -q /tmp/butler.zip -d /tmp/butler
          chmod +x /tmp/butler/butler
          /tmp/butler/butler push build-itch.zip "${ITCH_GAME_TARGET}:html5" --userversion "${GITHUB_REF_NAME}-${GITHUB_SHA::12}"
