name: Release all platforms

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-all-platforms
  cancel-in-progress: false

jobs:
  verify-and-package:
    name: Verify and package every supported target
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: jest-production
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - run: corepack enable
      - run: corepack prepare pnpm@11.21.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @qwordly/portal exec playwright install --with-deps chromium
      - name: Verify every configured target
        run: pnpm verify:all-targets
      - name: Run core provider release adapters
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${JEST_GAME_UPLOAD_TOKEN}" ]]; then
            pnpm release:jest
          else
            echo "Jest publish skipped: configure JEST_GAME_UPLOAD_TOKEN in the jest-production environment."
          fi
          pnpm release:facebook
          pnpm release:youtube
          if pnpm --filter @qwordly/reddit-app validate:contracts; then
            pnpm release:reddit
          else
            echo "Reddit release handoff skipped: capture the six sanitized production contract fixtures first."
          fi
          pnpm release:netflix
          pnpm release:yahoo
          pnpm release:gamesnacks
        env:
          JEST_GAME_UPLOAD_TOKEN: ${{ secrets.JEST_GAME_UPLOAD_TOKEN }}
          JEST_NOTIFICATION_EMAIL: ${{ secrets.JEST_NOTIFICATION_EMAIL }}
      - name: Create neutral HTML5 handoff
        run: pnpm release:html5
      - name: Create distribution-specific HTML5 handoffs
        run: |
          pnpm release:itch
          pnpm release:crazygames
          pnpm release:newgrounds
          pnpm release:gamejolt
          pnpm release:coolmath
          pnpm release:armor
          pnpm release:gamepix
          pnpm release:addictinggames
          pnpm release:htmlgames
          pnpm release:playkovo
          pnpm release:kongregate
          pnpm release:lagged
          pnpm release:gamedistribution
          pnpm release:gamemonetize
          pnpm release:yandex
          pnpm release:telegram
          pnpm release:microsoft-pwa
          pnpm release:y8
          pnpm release:playgama
          pnpm release:amazon
          pnpm release:jiogames
          pnpm release:famobi
          pnpm release:gamepush
          pnpm release:softgames
          pnpm release:wgplayground
          pnpm release:miniplay
          pnpm release:kizi
          pnpm release:huawei
          pnpm release:gameflare
          pnpm release:shockwave
          pnpm release:airconsole
          pnpm release:world
          pnpm release:farcaster
          pnpm release:pi
          pnpm release:minipay
          pnpm release:zoom
          pnpm release:pwa-directory
          pnpm release:miro
          pnpm release:greenhouse
          pnpm release:ozogames
          pnpm release:slowden
          pnpm release:noadsgames
          pnpm release:yalgames
          pnpm release:rando
          pnpm release:pwastore
      - name: Record the successful release in the dashboard
        run: node scripts/release/record-release-automation.mjs
        env:
          ITCH_BUTLER_CONFIGURED: ${{ secrets.ITCH_BUTLER_API_KEY != '' && vars.ITCH_GAME_TARGET != '' }}
          JEST_PUBLISH_CONFIGURED: ${{ secrets.JEST_GAME_UPLOAD_TOKEN != '' }}
          REDDIT_CONTRACTS_CONFIGURED: false
      - name: Verify every release target end to end
        run: pnpm test:release-targets:e2e
      - name: Install release dashboard dependencies
        run: npm ci
        working-directory: docs/reports/platform-release-readiness
      - name: Build the release dashboard
        run: npm run build
        working-directory: docs/reports/platform-release-readiness
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: riddle-quest-release-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            build-html5.zip
            build-html5.sha256
            build-itch.zip
            build-itch.zip.manifest.json
            build-crazygames-basic.zip
            build-crazygames-basic.zip.manifest.json
            build-newgrounds.zip
            build-newgrounds.zip.manifest.json
            build-gamejolt.zip
            build-gamejolt.zip.manifest.json
            build-coolmath-pitch.zip
            build-coolmath-pitch.zip.manifest.json
            build-armor-pitch.zip
            build-armor-pitch.zip.manifest.json
            build-gamepix-review.zip
            build-gamepix-review.zip.manifest.json
            build-addictinggames-review.zip
            build-addictinggames-review.zip.manifest.json
            build-htmlgames-pitch.zip
            build-htmlgames-pitch.zip.manifest.json
            build-playkovo-review.zip
            build-playkovo-review.zip.manifest.json
            build-kongregate.zip
            build-kongregate.zip.manifest.json
            build-lagged-review.zip
            build-lagged-review.zip.manifest.json
            build-gamedistribution-review.zip
            build-gamedistribution-review.zip.manifest.json
            build-gamemonetize-review.zip
            build-gamemonetize-review.zip.manifest.json
            build-yandex-review.zip
            build-yandex-review.zip.manifest.json
            build-telegram-review.zip
            build-telegram-review.zip.manifest.json
            build-microsoft-pwa.zip
            build-microsoft-pwa.zip.manifest.json
            build-gamesnacks.zip
            build-gamesnacks.zip.manifest.json
            build-y8-review.zip
            build-y8-review.zip.manifest.json
            build-playgama-review.zip
            build-playgama-review.zip.manifest.json
            build-amazon-webapp-review.zip
            build-amazon-webapp-review.zip.manifest.json
            build-jiogames-review.zip
            build-jiogames-review.zip.manifest.json
            build-famobi-pitch.zip
            build-famobi-pitch.zip.manifest.json
            build-gamepush-review.zip
            build-gamepush-review.zip.manifest.json
            build-softgames-pitch.zip
            build-softgames-pitch.zip.manifest.json
            build-wgplayground-review.zip
            build-wgplayground-review.zip.manifest.json
            build-miniplay-review.zip
            build-miniplay-review.zip.manifest.json
            build-kizi-pitch.zip
            build-kizi-pitch.zip.manifest.json
            build-huawei-quick-game-review.zip
            build-huawei-quick-game-review.zip.manifest.json
            build-gameflare-review.zip
            build-gameflare-review.zip.manifest.json
            build-shockwave-review.zip
            build-shockwave-review.zip.manifest.json
            build-airconsole-review.zip
            build-airconsole-review.zip.manifest.json
            build-world-mini-app-review.zip
            build-world-mini-app-review.zip.manifest.json
            build-farcaster-mini-app-review.zip
            build-farcaster-mini-app-review.zip.manifest.json
            build-pi-apps-review.zip
            build-pi-apps-review.zip.manifest.json
            build-minipay-mini-app-review.zip
            build-minipay-mini-app-review.zip.manifest.json
            build-zoom-app-review.zip
            build-zoom-app-review.zip.manifest.json
            build-pwa-directory-review.zip
            build-pwa-directory-review.zip.manifest.json
            build-miro-marketplace-review.zip
            build-miro-marketplace-review.zip.manifest.json
            build-greenhouse-review.zip
            build-greenhouse-review.zip.manifest.json
            build-ozogames-review.zip
            build-ozogames-review.zip.manifest.json
            build-slowden-review.zip
            build-slowden-review.zip.manifest.json
            build-noadsgames-review.zip
            build-noadsgames-review.zip.manifest.json
            build-yalgames-review.zip
            build-yalgames-review.zip.manifest.json
            build-rando-review.zip
            build-rando-review.zip.manifest.json
            build-pwastore-review.zip
            build-pwastore-review.zip.manifest.json
            build-youtube.zip
            build-youtube.manifest.json
            build-youtube.test-report.json
            packages/portal/dist-facebook
            packages/portal/dist-reddit
            packages/portal/dist-yahoo
            packages/portal/dist-gamesnacks
            docs/reports/platform-release-readiness/dist/index.html

  itch:
    name: Publish itch.io when configured
    needs: verify-and-package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BUTLER_API_KEY: ${{ secrets.ITCH_BUTLER_API_KEY }}
      ITCH_GAME_TARGET: ${{ vars.ITCH_GAME_TARGET }}
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: riddle-quest-release-${{ github.sha }}
      - name: Publish the verified HTML5 archive
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${BUTLER_API_KEY}" || -z "${ITCH_GAME_TARGET}" ]]; then
            echo "itch.io skipped: configure ITCH_BUTLER_API_KEY and ITCH_GAME_TARGET after creating the project page."
            exit 0
          fi
          curl --fail --location --silent --show-error \
            https://broth.itch.ovh/butler/linux-amd64/LATEST/archive/default \
            --output /tmp/butler.zip
          unzip -q /tmp/butler.zip -d /tmp/butler
          chmod +x /tmp/butler/butler
          /tmp/butler/butler push build-itch.zip "${ITCH_GAME_TARGET}:html5" --userversion "${GITHUB_REF_NAME}-${GITHUB_SHA::12}"
