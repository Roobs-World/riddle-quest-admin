name: RN Upgrade Validation

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: RN Upgrade Checks
        run: pnpm run check:rn-upgrade

      - name: Lint
        run: pnpm run lint

      - name: Unit Tests
        run: pnpm run test:rn -- --runInBand
