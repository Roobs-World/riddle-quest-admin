name: Production readiness

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-readiness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace-node24:
    name: Workspace (Node 24)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - run: corepack enable
      - run: corepack prepare pnpm@11.21.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: pnpm audit --audit-level high
      - run: pnpm check:security
      - run: pnpm check:monetization
      - run: pnpm check:types
      - run: pnpm --dir firebase-functions lint
      - run: pnpm check:facebook-secrets
      - run: pnpm check:facebook-copy
      - run: pnpm --dir firebase-functions test:youtube-content
      - run: pnpm test:coverage
      - run: pnpm --filter @qwordly/portal test:release-scripts
      - run: pnpm test:architecture
      - run: pnpm build
      - run: git diff --exit-code -- firebase-functions/packages/core/package.json

  functions-node22:
    name: Firebase Functions (Node 22)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: firebase-functions/.nvmrc
      - run: corepack enable
      - run: corepack prepare pnpm@11.21.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:functions-lock
      - run: pnpm --dir firebase-functions test:deploy-scripts
      - run: pnpm verify:functions:node22
      - run: pnpm --dir firebase-functions build

  browser-and-rules:
    name: Browser and Firebase rules
    needs: workspace-node24
    runs-on: ubuntu-24.04
    # The complete serial input/lifecycle matrix plus the ten-minute soak exceeds 30 minutes.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - run: corepack enable
      - run: corepack prepare pnpm@11.21.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @qwordly/portal exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm check:w3c
      - run: pnpm --filter @qwordly/reddit-app build:package:from-client
      - run: pnpm --filter @qwordly/portal preflight:jest-upload
      - run: pnpm --filter @qwordly/portal preflight:facebook-upload
      - run: pnpm check:facebook-progress
      - run: pnpm check:youtube-progress

  development-dashboard:
    name: Persist verified development progress
    needs: [workspace-node24, functions-node22, browser-and-rules]
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
      - name: Record successful checks before attempting dashboard delivery
        run: node scripts/release/complete-development-task.mjs --ci
        env:
          DEVELOPMENT_VERIFICATION_JOBS: ${{ toJSON(needs) }}
      - name: Check dashboard delivery configuration
        env:
          WIF_PROVIDER: ${{ vars.DEVELOPMENT_DASHBOARD_WIF_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.DEVELOPMENT_DASHBOARD_SERVICE_ACCOUNT }}
        run: |
          test -n "$WIF_PROVIDER" || { echo "Configure DEVELOPMENT_DASHBOARD_WIF_PROVIDER; the completion receipt is retained for retry."; exit 1; }
          test -n "$SERVICE_ACCOUNT" || { echo "Configure DEVELOPMENT_DASHBOARD_SERVICE_ACCOUNT; the completion receipt is retained for retry."; exit 1; }
      - id: dashboard-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.DEVELOPMENT_DASHBOARD_WIF_PROVIDER }}
          service_account: ${{ vars.DEVELOPMENT_DASHBOARD_SERVICE_ACCOUNT }}
          token_format: access_token
      - name: Publish to the existing persistent dashboard snapshot
        run: node scripts/release/complete-development-task.mjs --retry "artifacts/development-progress/ci-production-readiness_${GITHUB_SHA}-${GITHUB_SHA}.json" --publish
        env:
          MONITOR_ACCESS_TOKEN: ${{ steps.dashboard-auth.outputs.access_token }}
          DEVELOPMENT_ACCEPTED_BRANCH: ${{ github.event.repository.default_branch }}
      - name: Retain completion receipts and delivery failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: development-progress-${{ github.sha }}
          path: artifacts/development-progress/
          if-no-files-found: error
          retention-days: 90
