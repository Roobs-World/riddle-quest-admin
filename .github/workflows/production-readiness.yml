name: Production readiness

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-readiness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace-node24:
    name: Workspace (Node 24)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - run: corepack enable
      - run: corepack prepare pnpm@12.21.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: pnpm audit --audit-level high
      - run: pnpm check:security
      - run: pnpm check:monetization
      - run: pnpm check:types
      - run: pnpm --dir firebase-functions lint
      - run: pnpm check:facebook-secrets
      - run: pnpm check:facebook-copy
      - run: pnpm --dir firebase-functions test:youtube-content
      - run: pnpm test:coverage
      - run: pnpm --filter @riddle-quest/portal test:release-scripts
      - run: pnpm test:architecture
      - run: pnpm build
      - run: git diff --exit-code -- firebase-functions/packages/core/package.json

  functions-node22:
    name: Firebase Functions (Node 22)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: firebase-functions/.nvmrc
      - run: corepack enable
      - run: corepack prepare pnpm@12.21.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:functions-lock
      - run: pnpm --dir firebase-functions test:deploy-scripts
      - run: pnpm verify:functions:node22
      - run: pnpm --dir firebase-functions build

  browser-and-rules:
    name: Browser and Firebase rules
    needs: workspace-node24
    runs-on: ubuntu-24.04
    # The serial matrix (emulator rules, ~315 build, browser and lifecycle steps, and the
    # ten-minute soak) reached step ~200 of 315 at 120 minutes on ubuntu-24.04 runners.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - run: corepack enable
      - run: corepack prepare pnpm@12.21.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @riddle-quest/portal exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm check:w3c
      - run: pnpm --filter @riddle-quest/reddit-app build:package:from-client
      - run: pnpm --filter @riddle-quest/portal preflight:jest-upload
      - run: pnpm --filter @riddle-quest/portal preflight:facebook-upload
      - run: pnpm check:facebook-progress
      - run: pnpm check:youtube-progress

  development-progress:
    name: Record verified development progress
    needs: [workspace-node24, functions-node22, browser-and-rules]
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
      - name: Record the successful checks as a completion receipt
        run: node scripts/release/complete-development-task.mjs --ci
        env:
          DEVELOPMENT_VERIFICATION_JOBS: ${{ toJSON(needs) }}
      - name: Retain the completion receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: development-progress-${{ github.sha }}
          path: artifacts/development-progress/
          if-no-files-found: error
          retention-days: 90
