name: Production readiness

on:
  workflow_dispatch:
    inputs:
      confirm_runner_usage:
        description: Build and audit using Actions allowance, up to 105 runner minutes
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: production-readiness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace-node24:
    name: Jest and Facebook workspace (Node 24)
    if: github.ref == 'refs/heads/main' && inputs.confirm_runner_usage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - run: corepack enable
      - run: corepack prepare pnpm@12.21.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: pnpm audit --audit-level high
      - run: pnpm check:security
      - run: pnpm check:monetization
      - run: pnpm check:types:jest-facebook
      - run: pnpm --dir firebase-functions lint
      - run: pnpm check:facebook-secrets
      - run: pnpm check:facebook-copy
      - run: pnpm build:jest-facebook
      - run: git diff --exit-code -- firebase-functions/package.json

  functions-node22:
    name: Firebase Functions (Node 22)
    if: github.ref == 'refs/heads/main' && inputs.confirm_runner_usage
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: firebase-functions/.nvmrc
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - run: corepack enable
      - run: corepack prepare pnpm@12.21.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:functions-lock
      - run: pnpm verify:functions:node22
      - run: pnpm --dir firebase-functions check:types
      - run: pnpm --dir firebase-functions build

  artifact-integrity:
    name: Jest and Facebook artifact integrity
    if: github.ref == 'refs/heads/main' && inputs.confirm_runner_usage
    needs: [workspace-node24, functions-node22]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - run: corepack enable
      - run: corepack prepare pnpm@12.21.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:jest-facebook
      - run: pnpm --filter riddle-quest validate:w3c builds/jest/index.html builds/facebook/index.html
      - run: pnpm --filter riddle-quest preflight:jest-upload
      - name: Package the audited Facebook build
        run: node platforms/web/facebook/scripts/prepare-facebook-draft.mjs
      - run: pnpm check:facebook-progress
