name: Upload and activate Jest build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-jest-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify, upload and activate Jest build
    if: github.ref == 'refs/heads/jest'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    environment: jest-production
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - run: corepack enable
      - run: corepack prepare pnpm@11.21.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @qwordly/portal exec playwright install --with-deps chromium
        timeout-minutes: 15
      - name: Install the release sandbox
        run: sudo apt-get update && sudo apt-get install --yes bubblewrap
      - name: Run the immutable build release without game publication
        run: pnpm release:jest
        env:
          JEST_GAME_UPLOAD_TOKEN: ${{ secrets.JEST_GAME_UPLOAD_TOKEN }}
          JEST_NOTIFICATION_EMAIL: ${{ secrets.JEST_NOTIFICATION_EMAIL }}
