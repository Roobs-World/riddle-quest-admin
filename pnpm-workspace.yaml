packages:
  - "packages/*"
  - "firebase-functions"

autoInstallPeers: false

# Upstream image-size is archived with no fixed release. These advisories are
# ignored only because the exact transitive package is patched and regression
# tested by scripts/image-size-security-patch.test.mjs.
audit:
  ignore:
    - GHSA-5p2g-fcmc-qvqq
    - GHSA-w3rx-r6r6-pgpr

peerDependencyRules:
  allowedVersions:
    eslint: "10"
    jest: "30"
    typescript: "6"

overrides:
  "@tootallnate/once": "2.0.1"
  "@xmldom/xmldom": "0.8.13"
  "@jest/environment": "30.4.1"
  "@jest/fake-timers": "30.4.1"
  "@jest/globals": "30.4.1"
  babel-jest: "30.4.1"
  brace-expansion: "5.0.9"
  fast-xml-builder: "1.3.0"
  fast-xml-parser: "5.10.1"
  graphql: "16.14.2"
  "@istanbuljs/load-nyc-config>js-yaml": "3.15.1"
  "external-editor>tmp": "0.2.7"
  jest-environment-jsdom: "30.4.1"
  jest-environment-node: "30.4.1"
  jest-mock: "30.4.1"
  postcss: "8.5.25"
  protobufjs: "7.6.5"
  qs: "6.15.3"
  "minimatch@3>brace-expansion": "1.1.18"
  "minimatch@8>brace-expansion": "2.1.4"
  "minimatch@9>brace-expansion": "2.1.4"
  uuid: "11.1.1"
  ws: "8.21.1"

onlyBuiltDependencies:
  - "@firebase/util"
  - "@sentry/cli"
  - "@swc/core"
  - msgpackr-extract
  - protobufjs
  - unrs-resolver

allowBuilds:
  "@firebase/util": true
  "@sentry/cli": true
  "@swc/core": true
  dtrace-provider: false
  edgedriver: false
  esbuild: false
  geckodriver: false
  protobufjs: true
  re2: false
  unrs-resolver: false

patchedDependencies:
  image-size@2.0.2: patches/image-size@2.0.2.patch
