packages:
  - "packages/*"
  - "platforms/native/*"
  - "platforms/web/*"
  - "firebase-functions"

autoInstallPeers: false

# This upstream advisory has no fixed release. Its exception requires the exact
# installed patch and security regression checks to pass.
audit:
  ignore:
    # Depth guards backported from braces PR72; checked before production audit.
    - GHSA-vfj7-8cjw-p6xm

peerDependencyRules:
  allowedVersions:
    eslint: "10"
    jest: "30"
    typescript: "6"

overrides:
  "babel-jest@30.5.2>@babel/core:peer": "-"
  # Firebase Admin runs on Node 22; newer database-compat patches require Node 24.
  "firebase-admin>@firebase/database-compat": "2.1.7"
  # Keep Firestore's older Node transport off CVE-2026-101916 without changing Firebase itself.
  "@firebase/firestore>@grpc/grpc-js": "1.14.7"
  "@fastify/busboy": "3.2.6"
  "@grpc/grpc-js": "1.14.7"
  "@modelcontextprotocol/client": "2.4.0"
  "@modelcontextprotocol/sdk": "1.32.2"
  "@modelcontextprotocol/server": "2.4.0"
  "@tootallnate/once": "2.0.1"
  "@xmldom/xmldom": "0.8.15"
  "@jest/environment": "30.5.2"
  "@jest/fake-timers": "30.5.2"
  "@jest/globals": "30.5.2"
  babel-jest: "30.5.2"
  basic-ftp: "6.2.6"
  "body-parser@1": "1.20.9"
  "body-parser@2": "2.4.0"
  brace-expansion: "5.0.13"
  fast-xml-builder: "1.3.2"
  fast-xml-parser: "5.12.1"
  fast-uri: "3.1.9"
  compression: "1.8.2"
  graphql: "16.15.0"
  hono: "4.13.19"
  ip-address: "10.7.6"
  # GHSA-9qw7-j9xw-fv9c: prevent checkout writes through directory symlinks in the Reddit CLI.
  isomorphic-git: "1.44.18"
  "js-yaml@3": "3.15.2"
  "js-yaml@4": "4.3.2"
  "@improbable-eng/grpc-web@0.15.0>google-protobuf:peer": "-"
  "external-editor>tmp": "0.2.7"
  jest-environment-jsdom: "30.5.2"
  jest-environment-node: "30.5.2"
  jest-mock: "30.5.2"
  morgan: "1.12.1"
  postcss: "8.5.33"
  proxy-addr: "2.0.8"
  puppeteer-core: "25.18.1"
  protobufjs: "7.6.6"
  qs: "6.17.1"
  # GHSA-gg6h-894w-4m9c: quadratic-time ReDoS in re2js below 2.8.7 (via @firebase/firestore).
  re2js: "2.10.0"
  source-map-js: "1.2.4"
  "minimatch@3>brace-expansion": "1.1.22"
  "minimatch@8>brace-expansion": "2.1.8"
  "minimatch@9>brace-expansion": "2.1.8"
  uuid: "11.1.1"
  "undici@6": "6.29.1"
  "undici@8": "8.13.1"
  ws: "8.23.0"
  "zod@4": "4.6.7"

onlyBuiltDependencies:
  - "@firebase/util"
  - "@sentry/cli"
  - "@swc/core"
  - msgpackr-extract
  - protobufjs
  - unrs-resolver

allowBuilds:
  "@firebase/util": true
  '@parcel/watcher': false
  "@sentry/cli": true
  "@swc/core": true
  dtrace-provider: false
  edgedriver: false
  esbuild: false
  geckodriver: false
  protobufjs: true
  re2: false
  unrs-resolver: false
  vnu-jar: false

packageExtensions:
  # RTDB imports app without declaring it; bind each client to its caller's registry.
  "@firebase/database@1.1.6":
    peerDependencies:
      "@firebase/app": "0.16.x"
  "babel-jest@30.5.2":
    dependencies:
      "@babel/core": "7.29.13"
  "@improbable-eng/grpc-web@0.15.0":
    dependencies:
      google-protobuf: "3.21.4"

patchedDependencies:
  braces@3.0.3: config/security-patches/braces@3.0.3.patch
