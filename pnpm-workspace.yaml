packages:
  - "packages/*"
  - "firebase-functions"

peerDependencyRules:
  allowedVersions:
    "@react-native/jest-preset": "0.86.0"
    jest: "30"
    typescript: "6"

overrides:
  "@tootallnate/once": "2.0.1"
  "@xmldom/xmldom": "0.8.13"
  "@jest/environment": "30.4.1"
  "@jest/fake-timers": "30.4.1"
  "@jest/globals": "30.4.1"
  babel-jest: "30.4.1"
  brace-expansion: "5.0.6"
  fast-xml-builder: "1.1.7"
  fast-xml-parser: "5.7.0"
  graphql: "16.12.0"
  jest-environment-jsdom: "30.4.1"
  jest-environment-node: "30.4.1"
  jest-mock: "30.4.1"
  postcss: "8.5.10"
  protobufjs: "7.5.8"
  qs: "6.15.2"
  "minimatch@3>brace-expansion": "1.1.15"
  "minimatch@8>brace-expansion": "2.1.1"
  "minimatch@9>brace-expansion": "2.1.1"
  uuid: "11.1.1"
  ws: "8.20.1"

onlyBuiltDependencies:
  - "@firebase/util"
  - "@sentry/cli"
  - msgpackr-extract
  - protobufjs
  - unrs-resolver

allowBuilds:
  "@clerk/shared": true
  "@firebase/util": true
  "@sentry/cli": true
  dtrace-provider: false
  edgedriver: false
  esbuild: false
  geckodriver: false
  protobufjs: true
  unrs-resolver: false

minimumReleaseAgeExclude:
  - '@expo/cli@57.0.3'
  - '@expo/fingerprint@0.20.1'
  - '@expo/inline-modules@0.1.1'
  - '@expo/local-build-cache-provider@57.0.1'
  - '@expo/metro-config@57.0.2'
  - '@expo/prebuild-config@57.0.3'
  - '@expo/router-server@57.0.1'
  - babel-preset-expo@57.0.1
  - expo-asset@57.0.2
  - expo-constants@57.0.2
  - expo-modules-autolinking@57.0.3
  - expo-modules-core@57.0.1
  - expo@57.0.1
  - expo-gl@57.0.1
  - expo-build-properties@57.0.2
