packages:
  - "packages/*"
  - "firebase-functions"

autoInstallPeers: false

# These upstream packages have no fixed release. Each narrowly scoped exception
# requires its exact installed patch and security regression checks to pass.
audit:
  ignore:
    - GHSA-5p2g-fcmc-qvqq
    - GHSA-w3rx-r6r6-pgpr
    # Depth guards backported from braces PR72; checked before production audit.
    - GHSA-vfj7-8cjw-p6xm

peerDependencyRules:
  allowedVersions:
    eslint: "10"
    jest: "30"
    typescript: "6"

overrides:
  # Keep Firestore's older Node transport off CVE-2026-101916 without changing Firebase itself.
  "@firebase/firestore>@grpc/grpc-js": "1.14.5"
  "@tootallnate/once": "2.0.1"
  "@xmldom/xmldom": "0.8.13"
  "@jest/environment": "30.4.1"
  "@jest/fake-timers": "30.4.1"
  "@jest/globals": "30.4.1"
  babel-jest: "30.4.1"
  basic-ftp: "6.2.1"
  brace-expansion: "5.0.12"
  fast-xml-builder: "1.3.0"
  fast-xml-parser: "5.10.1"
  fast-uri: "3.1.7"
  graphql: "16.14.2"
  "js-yaml@3": "3.15.2"
  "js-yaml@4": "4.3.2"
  "external-editor>tmp": "0.2.7"
  jest-environment-jsdom: "30.4.1"
  jest-environment-node: "30.4.1"
  jest-mock: "30.4.1"
  postcss: "8.5.25"
  protobufjs: "7.6.5"
  qs: "6.16.0"
  source-map-js: "1.2.2"
  "minimatch@3>brace-expansion": "1.1.21"
  "minimatch@8>brace-expansion": "2.1.7"
  "minimatch@9>brace-expansion": "2.1.7"
  uuid: "11.1.1"
  ws: "8.21.1"

onlyBuiltDependencies:
  - "@firebase/util"
  - "@sentry/cli"
  - "@swc/core"
  - msgpackr-extract
  - protobufjs
  - unrs-resolver

allowBuilds:
  "@firebase/util": true
  '@parcel/watcher': false
  "@sentry/cli": true
  "@swc/core": true
  dtrace-provider: false
  edgedriver: false
  esbuild: false
  geckodriver: false
  protobufjs: true
  re2: false
  unrs-resolver: false
  vnu-jar: false

patchedDependencies:
  braces@3.0.3: patches/braces@3.0.3.patch
  image-size@2.0.2: patches/image-size@2.0.2.patch
