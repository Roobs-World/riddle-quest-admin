project_id = "riddle-quest-notification-manager"

[api]
enabled = true
schemas = ["public", "graphql_public"]

[db.migrations]
schema_paths = ["./schemas/notifications.sql", "./schemas/subscriptions.sql", "./schemas/provider-registration.sql", "./schemas/firebase.sql", "./schemas/campaigns.sql", "./schemas/delivery.sql"]

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[functions.fcm-push]
enabled = true
verify_jwt = false
entrypoint = "./functions/fcm-push/index.ts"
